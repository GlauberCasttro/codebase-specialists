run:
  timeout: 3m
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gofmt
    - goimports
    - depguard
linters-settings:
  depguard:
    rules:
      sql-only-in-storage:
        files: ["!**/internal/storage/**"]
        deny:
          - pkg: github.com/jackc/pgx/v5
            desc: "SQL lives only in internal/storage"
